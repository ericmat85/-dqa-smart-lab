name: Demo checks
on:
  pull_request:
    branches: [main, codex/demo-mvp-nov6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render-backend/e4-mock.requirements.txt
      - run: python -m pip install --requirement render-backend/e4-mock.requirements.txt
      - run: npm test
      - run: npm run build
  browser:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render-backend/e4-mock.requirements.txt
      - run: python -m pip install --requirement render-backend/e4-mock.requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
