name: Demo checks
on:
  pull_request:
    branches: [main, codex/demo-mvp-nov6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render-backend/e4-mock.requirements.txt
      - run: python -m pip install --requirement render-backend/e4-mock.requirements.txt
      - run: npm test
      - run: npm run build
  browser:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: demo, shard: '1/6'}
          - {mode: demo, shard: '2/6'}
          - {mode: demo, shard: '3/6'}
          - {mode: demo, shard: '4/6'}
          - {mode: demo, shard: '5/6'}
          - {mode: demo, shard: '6/6'}
          - {mode: preview, shard: '1/2'}
          - {mode: preview, shard: '2/2'}
          - {mode: business, shard: '1/3'}
          - {mode: business, shard: '2/3'}
          - {mode: business, shard: '3/3'}
          - {mode: business-ai, shard: '1/1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render-backend/e4-mock.requirements.txt
      - run: python -m pip install --requirement render-backend/e4-mock.requirements.txt
      - run: npx playwright install --with-deps chromium
      - id: browser_tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }} --reporter=line,json
        env:
          BROWSER_MODE: ${{ matrix.mode }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - name: Publish browser test summary
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/ci/browser-summary.mjs test-results/results.json
        env:
          BROWSER_TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
      - uses: actions/upload-artifact@v4
        id: browser_failure_evidence
        if: ${{ !success() }}
        continue-on-error: true
        with:
          name: browser-failure-evidence-${{ matrix.mode }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
      - name: Explain unavailable browser evidence
        if: ${{ always() && steps.browser_failure_evidence.outcome == 'failure' }}
        run: |
          echo 'Detailed browser evidence could not be uploaded. Check the artifact step log and account storage quota. The test outcome is unchanged; the browser summary and test log remain available.' >> "$GITHUB_STEP_SUMMARY"
