x-concurrency-policy:
  status: PROPOSED
  etag: 單一雙引號opaque強tag，16–128 base64url字元，拒W/、*、多值。request aggregate涵蓋委託/審查/排程預約/接收/operation/報告及投影/歷程；其他資源各自版本。GET
    request/report/schedule回父aggregate tag；列表aggregateETag供client使用，不以legacy revision自行拼tag。 Account/Role/Notification列表項目必回resourceETag，讓沒有獨立GET明細的更新可取得版本；與寫入資源版本同源，body
    revision不得自行轉換。
  creation: POST schedules用父request If-Match；報告首送亦從GET父request取tag，不需不存在的report tag。operation核決從Request.pendingOperations取關聯及tag。純上傳只建文件隔離版本，不先標業務成功。
  atomicity: 在同交易內重驗身分/權限/狀態/版本/文件/容量/設備與人員衝突；request+reservation+設備及人員占用+decision+signature關聯+audit原子提交，equipment版本同步增加。跨request共用設備/人員需序列化/鎖定衝突集合，預檢不保證預約。
  idempotency: 完成日起24h；scope=安全realm+principalId+operationId+正規化path params+key。fingerprint含canonical body/file
    hash與原前置tag。同key不同payload/tag409 IDEMPOTENCY_CONFLICT，進行中409 IDEMPOTENCY_IN_PROGRESS+Retry-After:1。
  replayOrder: 先驗當前身分/失權/逐案與文件權限/CSRF，再查cache；成功且相同fingerprint回放原非秘密status/body，不重驗已成功那次舊If-Match。失權403不回body/tag；不回放cookie/CSRF/下載URL。成功紀錄與業務提交原子；授權/驗證/412/428失敗不記成功cache。
  retry: GET可重試；業務寫入逾時/連線中斷/429/503/結果不明5xx只用原key/body/tag查重，遵Retry-After，不新key盲送；超24h先讀狀態。412重讀人工確認後新key；409除IN_PROGRESS需處理原因。login無cache重新驗證；logout重複204；validate無副作用可重跑且不用冪等cache。
x-document-policy:
  status: 新增PROPOSED安全規則
  identity: 受控ID+requestId+purpose+documentVersion+hash+uploadedBy；bytes/version不可變。無文件bytes PATCH；AI/一般更新不覆寫原始或已簽核文件，衍生簽名Excel/PDF另建ID/version。
  binding: 可信登入者為signature owner；intent綁案件/action/requestETag及報告targetDocumentId/version。動作提交時重驗clean/purpose/owner/案件/action/當前權限/版本，ID存在不代表簽名或授權有效。一般委託主管/委託審查return不強制簽名；若提供則依R-GENERAL-RETURN-SIGNATURE驗使用者/案件/API操作/退回用途/版本後保留，不得忽略。只有OperationRequest.kind=cancel與OperationDecision.decision=return依labOperations原義忽略其簽名；OperationDecision.approve若提供才驗，不新增必簽。報告退回維持原流程，未擴張本輪規則。
  upload: 總32MiB；signature PNG/JPEG≤2MiB，report XLSX≤16MiB，attachment PDF/TXT/PNG/JPEG/XLSX≤32MiB；magic/MIME/extension一致、移除檔名路徑/控制字元；XLSX拒macro/外鏈、解壓≤100MiB/1000項。數值均PROPOSED待核。
  scan: 201僅quarantined metadata，不代表可用。quarantined→clean/rejected；未clean不可AI/簽核/內容下載，409 DOCUMENT_NOT_READY/REJECTED。無scanner必須留quarantine，不能假裝clean。
  download: 每次逐案/文件purpose/canReadReport授權後查檔，無關資源404避免存在性洩漏；業務已授權但動作被拒403。no-store、attachment、nosniff；不回storage
    key/永久公開URL。
  archiveRecovery: 先持久化新不可變產物並驗hash，再原子提交關聯/archived/audit/outbox；失敗仍待查閱、原文件不變，記重試工作與清理未引用暫存。相同冪等key查既有結果；不得因產檔失敗重簽或誤標已結案。
